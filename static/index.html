<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>English Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at 50% 20%, #1c1f2e, #0a0b12 70%);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
    padding: 20px 0;
  }
  .screen { text-align: center; display: none; width: 100%; max-width: 420px; padding: 20px; }
  .screen.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

  /* Incoming call */
  #incoming .avatar-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 24px; }
  #incoming .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(124,109,255,0.5);
    animation: pulse-ring 1.8s ease-out infinite;
  }
  #incoming .ring:nth-child(2) { animation-delay: 0.6s; }
  @keyframes pulse-ring {
    0% { transform: scale(0.9); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  #incoming .avatar {
    position: absolute; inset: 10px; border-radius: 50%;
    background: linear-gradient(135deg, #7c6dff, #a26bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
    box-shadow: 0 8px 30px rgba(124,109,255,0.4);
  }
  #incoming h2 { font-weight: 600; font-size: 22px; margin-bottom: 4px; }
  #incoming p { color: #8b8fa3; font-size: 14px; letter-spacing: 0.3px; }
  .call-buttons { display: flex; justify-content: center; gap: 70px; margin-top: 48px; }
  .call-buttons button {
    width: 62px; height: 62px; border-radius: 50%; border: none;
    font-size: 24px; cursor: pointer; color: white;
    transition: transform 0.15s ease;
  }
  .call-buttons button:active { transform: scale(0.9); }
  #decline { background: linear-gradient(135deg, #ff5f6d, #d0333f); }
  #accept { background: linear-gradient(135deg, #4ade80, #22a55a); }

  /* In-call */
  #inCall .top { color: #8b8fa3; font-size: 13px; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
  #timer { font-size: 15px; color: #b8bccb; margin-bottom: 24px; font-variant-numeric: tabular-nums; }
  .orb-wrap { width: 150px; height: 150px; margin: 0 auto 16px; position: relative; }
  .orb {
    width: 100%; height: 100%; border-radius: 50%;
    background: linear-gradient(135deg, #7c6dff, #ff6bcb);
    box-shadow: 0 0 40px rgba(124,109,255,0.35);
    transition: transform 0.2s ease;
  }
  .orb.speaking { animation: pulse 0.7s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
  #status { color: #8b8fa3; font-size: 14px; margin-bottom: 18px; min-height: 20px; }
  #transcript {
    text-align: left; max-height: 230px; overflow-y: auto; margin: 0 0 24px;
    padding: 4px 6px;
  }
  #transcript p { margin: 10px 0; line-height: 1.45; font-size: 14.5px; }
  #transcript .you { color: #7dd3fc; }
  #transcript .ai { color: #d8b4fe; }
  #transcript .correction {
    color: #fbbf24; font-size: 13px; background: rgba(251,191,36,0.08);
    padding: 8px 10px; border-radius: 8px; border-left: 2px solid #fbbf24;
  }
  #talkBtn {
    font-size: 15px; font-weight: 500; padding: 14px 36px; border-radius: 30px;
    border: none; background: linear-gradient(135deg, #7c6dff, #a26bff);
    color: white; cursor: pointer; box-shadow: 0 6px 20px rgba(124,109,255,0.35);
    transition: transform 0.15s ease;
  }
  #talkBtn:active { transform: scale(0.96); }
  #talkBtn:disabled { background: #2a2d3d; box-shadow: none; cursor: default; }
  #hangup {
    display: block; margin: 18px auto 0; background: none; border: none;
    color: #ff5f6d; cursor: pointer; font-size: 13px; letter-spacing: 0.3px;
  }

  /* Report screen */
  #report h2 { font-size: 20px; }
  #reportBody .row {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px solid #2a2d3d; font-size: 14px;
  }
  #reportBody .row span:first-child { color: #8b8fa3; }
  #reportBody .overall {
    display: flex; justify-content: space-between; padding: 14px 0;
    font-weight: 600; font-size: 16px;
  }
  #reportBody h3 { font-size: 14px; font-weight: 500; margin: 18px 0 6px; }
  #reportBody ul { padding-left: 18px; font-size: 13.5px; color: #d1d5db; }
  #reportBody li { margin: 4px 0; }
  #reportBody .strengths { color: #4ade80; font-size: 13.5px; margin-top: 4px; }
  #reportBody .improvements { color: #fbbf24; font-size: 13.5px; margin-top: 4px; }
  #newCall {
    margin-top: 24px; background: linear-gradient(135deg,#7c6dff,#a26bff);
    border: none; color: white; padding: 12px 28px; border-radius: 24px;
    cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 14px;
  }
</style>
</head>
<body>

<div id="incoming" class="screen active">
  <div class="avatar-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="avatar">🤖</div>
  </div>
  <h2>English Buddy</h2>
  <p>Incoming call…</p>
  <div class="call-buttons">
    <button id="decline">✕</button>
    <button id="accept">📞</button>
  </div>
</div>

<div id="inCall" class="screen">
  <div class="top">English Buddy</div>
  <div id="timer">00:00</div>
  <div class="orb-wrap"><div class="orb" id="orb"></div></div>
  <div id="status">Press "Talk" and speak</div>
  <div id="transcript"></div>
  <button id="talkBtn">🎤 Talk</button>
  <button id="hangup">End call</button>
</div>

<div id="report" class="screen">
  <h2>Session report</h2>
  <div id="reportBody"></div>
  <button id="newCall">New call</button>
</div>

<script>
const incoming = document.getElementById("incoming");
const inCall = document.getElementById("inCall");
const reportScreen = document.getElementById("report");
const orb = document.getElementById("orb");
const status = document.getElementById("status");
const transcript = document.getElementById("transcript");
const talkBtn = document.getElementById("talkBtn");
const timerEl = document.getElementById("timer");
const reportBody = document.getElementById("reportBody");

let seconds = 0, timerInterval;

document.getElementById("accept").addEventListener("click", startCall);
document.getElementById("decline").addEventListener("click", () => {
  incoming.classList.remove("active");
});
document.getElementById("hangup").addEventListener("click", showReport);
document.getElementById("newCall").addEventListener("click", () => location.reload());

function startCall() {
  incoming.classList.remove("active");
  inCall.classList.add("active");
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    timerEl.textContent = `${m}:${s}`;
  }, 1000);
}

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new Recognition();
recognition.lang = "en-US";
recognition.interimResults = false;

talkBtn.addEventListener("click", () => {
  talkBtn.disabled = true;
  status.textContent = "Listening…";
  recognition.start();
});

recognition.onresult = async (event) => {
  const said = event.results[0][0].transcript;
  status.textContent = "Thinking…";
  addLine("you", "You: " + said);

    const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: said }),
  });
  const data = await res.json();

  const lines = data.reply.split("Correction:");
  addLine("ai", "AI: " + lines[0].trim());
  if (lines[1]) addLine("correction", "✏ " + lines[1].trim());

  speak(lines[0].trim());
};

recognition.onerror = (e) => {
  status.textContent = "Error: " + e.error;
  talkBtn.disabled = false;
};

function addLine(cls, text) {
  const p = document.createElement("p");
  p.className = cls;
  p.textContent = text;
  transcript.appendChild(p);
  transcript.scrollTop = transcript.scrollHeight;
}

function speak(text) {
  const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "");
  orb.classList.add("speaking");
  status.textContent = "Speaking…";
  const utterance = new SpeechSynthesisUtterance(clean);
  utterance.lang = "en-US";
  utterance.onend = () => {
    orb.classList.remove("speaking");
    status.textContent = 'Press "Talk" and speak';
    talkBtn.disabled = false;
  };
  speechSynthesis.speak(utterance);
}

async function showReport() {
  clearInterval(timerInterval);
  inCall.classList.remove("active");
  reportScreen.classList.add("active");
  reportBody.innerHTML = "Analyzing your session…";

  try {
        const res = await fetch("/report");
    const data = await res.json();
    const r = JSON.parse(data.raw);

    const row = (label, val) =>
      `<div class="row"><span>${label}</span><span>${val}/10</span></div>`;

    reportBody.innerHTML = `
      ${row("Grammar", r.grammar)}
      ${row("Vocabulary", r.vocabulary)}
      ${row("Answer relevance", r.answer_relevance)}
      ${row("Sentence quality", r.sentence_quality)}
      ${row("Clarity", r.clarity)}
      ${row("Keyword usage", r.keyword_usage)}
      <div class="overall"><span>Overall</span><span>${r.overall}/10</span></div>
      <p style="color:#8b8fa3; font-size:13px;">Tone: ${r.sentiment}</p>
      <h3>Mistakes</h3>
      <ul>${r.grammar_mistakes.map(m => `<li>${m}</li>`).join("") || "<li>None</li>"}</ul>
      <h3>Strengths</h3>
      <div class="strengths">${r.strengths.map(s => "✓ " + s).join("<br>")}</div>
      <h3>To improve</h3>
      <div class="improvements">${r.improvements.map(s => "⚠ " + s).join("<br>")}</div>
    `;
  } catch (err) {
    reportBody.innerHTML = "Couldn't generate the report. Check the server terminal for an error.";
  }
}
</script>
</body>
</html>
